  if (hasCustomCover) {
    const imgUrl = s.article_thumbnail_path + s.thumbnail_edition + '.jpg';
    imgHTML = `<img src="${imgUrl}" alt="${s.article_name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
               <div class="no-cover" style="display:none">📖</div>`;
  } else {
    imgHTML = `<div class="no-cover">📖</div>`;
  }

  const statusClass = s.is_end ? 'status-end' : 'status-ongoing';
  const statusText = s.is_end ? 'จบแล้ว' : 'กำลังเขียน';
  const rankClass = rank <= 3 ? 'rank top3' : 'rank';

  const card = document.createElement('a');
  card.className = 'card';
  card.href = url;
  card.target = '_blank';
  card.rel = 'noopener noreferrer';
  card.innerHTML = `
    <div class="cover-wrap">
      ${imgHTML}
      <div class="${rankClass}">${rank}</div>
      <div class="status-badge ${statusClass}">${statusText}</div>
    </div>
    <div class="info">
      <div class="title">${s.article_name}</div>
      <div class="author">${s.author_name}</div>
      <div class="stats">
        <div class="stat views">👁 ${formatNum(s.view_count)}</div>
        <div class="stat chapters">📄 ${s.chapter_count} ตอน</div>
        <div class="stat favs">❤ ${formatNum(s.favourite_count)}</div>
      </div>
    </div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
