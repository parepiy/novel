<head>

<title>Boy Love Lovely Room — ใหม่มาแรง</title>
<style>
:root {
  --bg:        #130d1f;
  --surface:   #1e1530;
  --surface2:  #261d3a;
  --border:    #332650;
  --rose:      #e8609a;
  --violet:    #b89dff;
  --text:      #f0ebff;
  --text-muted:#8a7fa8;
  --end-color: #6fdfb0;
  --gold:      #f0c060;
  --silver:    #c8d0e0;
  --bronze:    #d49060;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:        #f5f0ff;
    --surface:   #ffffff;
    --surface2:  #ede6ff;
    --border:    #d8ccf5;
    --rose:      #d44e87;
    --violet:    #7c5cbf;
    --text:      #1a1030;
    --text-muted:#6b5e8a;
    --end-color: #1a9e74;
  }
}
:root[data-theme="dark"] {
  --bg:#130d1f;--surface:#1e1530;--surface2:#261d3a;--border:#332650;
  --rose:#e8609a;--violet:#b89dff;--text:#f0ebff;--text-muted:#8a7fa8;
  --end-color:#6fdfb0;
}
:root[data-theme="light"] {
  --bg:#f5f0ff;--surface:#ffffff;--surface2:#ede6ff;--border:#d8ccf5;
  --rose:#d44e87;--violet:#7c5cbf;--text:#1a1030;--text-muted:#6b5e8a;
  --end-color:#1a9e74;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Sarabun", "Noto Sans Thai", "TH Sarabun New", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Header ── */
header {
  padding: 36px 24px 28px;
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
}
.header-eyebrow {
  display: block;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--rose);
  margin-bottom: 6px;
  font-weight: 600;
}
header h1 {
  font-size: clamp(22px, 4vw, 34px);
  font-weight: 700;
  color: var(--text);
  text-wrap: balance;
  line-height: 1.2;
}
header h1 span {
  color: var(--violet);
}
.header-meta {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-muted);
  text-align: right;
  line-height: 1.8;
}

/* ── Divider ── */
.divider {
  height: 1px;
  background: linear-gradient(90deg, var(--rose) 0%, var(--violet) 40%, transparent 100%);
  max-width: 1400px;
  margin: 0 auto 28px;
  opacity: .4;
}

/* ── Grid ── */
.grid-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px 60px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 18px;
}

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform .18s ease, box-shadow .18s ease;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(0,0,0,.45);
}
.card:focus-visible {
  outline: 2px solid var(--rose);
  outline-offset: 2px;
}

/* ── Cover ── */
.cover-wrap {
  position: relative;
  aspect-ratio: 2 / 3;
  background: var(--surface2);
  overflow: hidden;
  flex-shrink: 0;
}
.cover-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.cover-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  font-size: 40px;
  color: var(--border);
}

.rank-badge {
  position: absolute;
  top: 7px;
  left: 7px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  backdrop-filter: blur(4px);
  border: 1.5px solid;
}
.rank-1 { background: rgba(240,192, 96,.25); border-color: var(--gold);   color: var(--gold);   }
.rank-2 { background: rgba(200,208,224,.2);  border-color: var(--silver); color: var(--silver); }
.rank-3 { background: rgba(212,144, 96,.22); border-color: var(--bronze); color: var(--bronze); }
.rank-n { background: rgba(19,13,31,.6);     border-color: var(--border); color: var(--text-muted); }

.status-badge {
  position: absolute;
  top: 7px;
  right: 7px;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: .03em;
}
.status-end  { background: rgba(111,223,176,.15); color: var(--end-color); border: 1px solid rgba(111,223,176,.3); }
.status-wip  { background: rgba(232, 96,154,.15); color: var(--rose);      border: 1px solid rgba(232, 96,154,.3); }

/* ── Meta ── */
.card-meta {
  padding: 9px 10px 11px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
}
.card-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  color: var(--text);
}
.card-author {
  font-size: 11.5px;
  color: var(--rose);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.tag-chip {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  background: var(--surface2);
  color: var(--violet);
  border: 1px solid var(--border);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 90px;
}
.card-stats {
  margin-top: auto;
  display: flex;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.stat {
  display: flex;
  align-items: center;
  gap: 3px;
}
.stat svg {
  opacity: .7;
  flex-shrink: 0;
}

/* ── Footer ── */
footer {
  text-align: center;
  padding: 0 0 32px;
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: .04em;
}

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  header { padding: 24px 16px 20px; }
  .grid-wrap { padding: 0 12px 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
}
</style>

      <div class="status-badge ${s.is_end ? 'status-end' : 'status-wip'}">${s.is_end ? 'จบแล้ว' : 'กำลังเขียน'}</div>
    </div>
    <div class="card-meta">
      <div class="card-title">${s.article_name}</div>
      <div class="card-author">${s.author_name}</div>
      ${s.tag_list && s.tag_list.length ? `<div class="card-tags">${s.tag_list.slice(0,3).map(t=>`<span class="tag-chip">${t.tag_name}</span>`).join('')}</div>` : ''}
      <div class="card-stats">
        <span class="stat">${iconEye} ${fmt(s.view_count)}</span>
        <span class="stat">${iconHeart} ${fmt(s.favourite_count)}</span>
        <span class="stat">${iconBook} ${s.chapter_count}</span>
      </div>
    </div>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
